name: Release

# Publishing is deliberately manual. There is no publish-on-tag trigger: a tag is
# cheap to create by accident, and npm publishes cannot be taken back.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarballs, but do not publish'
        type: boolean
        default: true
      # The first publish of a package name cannot use the trusted publisher — npm has nothing to
      # attach one to yet. That legitimate exception is the only reason the assertion below can be
      # waived, and waiving it has to be a visible choice recorded in the run's inputs rather than
      # a condition the workflow quietly tolerates every time.
      allow_token_fallback:
        description: 'First publish of a new package name: allow NPM_TOKEN instead of the trusted publisher'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      # Required for npm provenance. Without it `npm publish --provenance` cannot
      # mint an OIDC token and fails rather than publishing unattested.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pnpm through Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release:check is the gate, not a formality: it runs typecheck, lint, the full
      # suite, the e2e suite, the pack schema drift guard, then unpacks the actual
      # tarballs and asserts both directions — the published schemas match the TypeBox
      # truth source, and no .env / fixture / test file rode along. It also rejects a
      # placeholder repository.url, which would make the provenance step fail with a
      # 422 after the publish had already started.
      - name: Run release gate
        run: pnpm release:check

      - name: Report what would be published
        run: |
          pnpm --filter @dshpack/core pack --dry-run
          pnpm --filter dshpack pack --dry-run

      # A dry run that never touches auth cannot tell you the release will fail the way
      # the first one did, twice: 403 for a token without 2FA bypass, then 404 for a
      # scope that did not exist. pnpm builds publish options — performing the OIDC
      # exchange — before it honours --dry-run, so this reaches the registry and stops
      # short of uploading.
      #
      # NODE_AUTH_TOKEN is deliberately absent here. pnpm sets the token first and lets a
      # successful OIDC exchange overwrite it, so with the token present a green run
      # would prove nothing about the trusted publisher: silent fallback looks identical
      # to success. Without it, `Skipped OIDC` is the whole signal.
      # --force is what makes this check real rather than decorative: without it pnpm
      # skips any package whose version is already in the registry, so once a version is
      # out the packages are never processed, the exchange never runs, and asserting on
      # its absence passes while testing nothing. --force only bypasses that skip;
      # --dry-run still returns before anything is uploaded.
      - name: Verify trusted publishing without publishing
        if: ${{ inputs.dry_run == true }}
        run: |
          set -o pipefail
          pnpm publish --recursive --access public --no-git-checks --provenance \
            --dry-run --force 2>&1 | tee publish-auth-check.log

          # Assert positively that both packages were reached. Absence of a failure
          # marker is not evidence when the step could have processed nothing at all.
          reached="$(grep -c '(dry run)' publish-auth-check.log || true)"
          if [ "$reached" -ne 2 ]; then
            echo "::error::Expected 2 packages to reach the publish path, saw ${reached}."
            echo "::error::Nothing was verified. Check the log above before trusting a green release."
            exit 1
          fi

          if grep -q 'Skipped OIDC' publish-auth-check.log; then
            echo "::error::OIDC exchange failed, so the trusted publisher is not in effect."
            echo "::error::A real publish would silently fall back to NPM_TOKEN. Reason above."
            exit 1
          fi
          echo "Trusted publishing is in effect: ${reached} packages exchanged an OIDC token."

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        run: |
          set -o pipefail
          pnpm publish --recursive --access public --no-git-checks --provenance 2>&1 | tee publish.log
        env:
          # npm prefers the OIDC identity when a trusted publisher is configured for the
          # package and falls back to this token otherwise. The first publish of a new
          # package name has to use the token: npm cannot register a trusted publisher
          # for a package that does not exist yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The dry-run step above proves the trusted publisher CAN work. Nothing proved it was still
      # in effect for the publish that actually happened — pnpm sets NODE_AUTH_TOKEN first and lets
      # a successful OIDC exchange overwrite it, so a silent fallback to the token publishes
      # successfully and reads identically in the log. This marker is the only difference.
      #
      # Checking afterwards cannot undo an upload, and that is not what it is for: it is the
      # difference between knowing which identity signed the release and assuming it.
      - name: Assert the publish used the trusted publisher
        if: ${{ inputs.dry_run == false && inputs.allow_token_fallback == false }}
        run: |
          if grep -q 'Skipped OIDC' publish.log; then
            echo "::error::The publish fell back to NPM_TOKEN; the trusted publisher was not in effect."
            echo "::error::The packages ARE published. Verify provenance on the registry before announcing."
            exit 1
          fi
          echo "Publish used the trusted publisher."

      # Being uploaded is not the same as being installable, and this repo has been bitten by the
      # gap twice. Ask the registry, not the publish log.
      #
      # The registry also settles who published: `_npmUser` is what npm recorded, not what our
      # tooling narrated. The step above reads pnpm's own output, which is the right place to fail
      # fast with a reason; this is the authoritative version of the same question.
      - name: Verify both packages resolve from the registry
        if: ${{ inputs.dry_run == false }}
        run: |
          expect_oidc='${{ inputs.allow_token_fallback == false }}'

          # Both loops retry rather than read once. This step runs after an irreversible upload, so
          # a check that mistakes registry propagation lag for a failed release is worse than no
          # check: it would cry wolf on a perfectly good publish and teach the next reader to
          # ignore it. Fail only once the registry has had time to answer and still disagrees.
          resolves() {
            name="$1"
            version="$(node -p "require('./packages/$2/package.json').version")"
            resolved=''
            for attempt in 1 2 3 4 5; do
              if [ "$(npm view "${name}@${version}" version 2>/dev/null)" = "${version}" ]; then
                resolved=yes
                break
              fi
              echo "attempt ${attempt}: ${name}@${version} not resolvable yet"
              sleep 10
            done
            if [ -z "$resolved" ]; then
              echo "::error::${name}@${version} never became resolvable. Published is not delivered."
              return 1
            fi
            echo "${name}@${version} resolves from the registry."
            [ "$expect_oidc" = 'true' ] || return 0

            for attempt in 1 2 3 4 5; do
              publisher="$(npm view "${name}@${version}" _npmUser --json 2>/dev/null || true)"
              case "$publisher" in
                *npm-oidc-no-reply*)
                  echo "  published by the trusted publisher: ${publisher}"
                  return 0 ;;
                '')
                  echo "  attempt ${attempt}: _npmUser not published yet"
                  sleep 10 ;;
                *)
                  echo "::error::${name}@${version} was published by ${publisher}, not the OIDC bot."
                  return 1 ;;
              esac
            done
            echo "::error::${name}@${version} never reported a publisher; cannot confirm the identity."
            return 1
          }
          resolves '@dshpack/core' core
          resolves dshpack cli
