name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Headroom for a suite that grows every M1 batch. Still a real ceiling: a genuine hang
    # fails here rather than burning a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0

      - name: Activate pnpm through Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      # Defender scans every file the suite writes under the C: temp directory, and it holds
      # a handle open while it does. That is one mechanism producing both symptoms seen on
      # windows-latest: I/O-heavy tests running 20-34x slower than the same tests locally
      # (848ms -> 20000ms timeout for the migrate cases), and `EBUSY ... rmdir` when a
      # fixture root is removed while the scan still owns a handle. Excluding the paths this
      # job owns is scoped to an ephemeral runner and changes no product behaviour.
      - name: Exclude runner paths from Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}", "$env:TEMP"
          Add-MpPreference -ExclusionProcess node.exe, pnpm.exe, powershell.exe

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check:ci`, not `check`: the full `check` ends with `test` and `test:e2e`, both of
      # which the next two steps run again. Every job was therefore running the unit suite
      # twice and the e2e suite twice, which is what pushed windows-latest past its budget
      # once M1-3/M1-4 took the suite from 1014 to 1753 tests. Nothing is skipped — the
      # coverage step is a strict superset of `test` and gates the per-file thresholds too.
      - name: Check source
        run: pnpm check:ci

      - name: Run coverage suite
        run: pnpm test:coverage

      - name: Run end-to-end suite
        run: pnpm test:e2e

      - name: Dry-run package contents
        run: pnpm pack:dry-run

  real-dsh-contract:
    name: Real DSH contract smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DSH_HOME cannot live here: the `runner` context is only available to steps, and
    # naming it at job level fails workflow validation before a single job starts — which
    # is why every run reported failure with zero jobs and the workflow displayed as its
    # own path instead of "CI". It is set per step below instead.
    env:
      DSH_REAL_SMOKE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0

      - name: Activate pnpm through Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the pinned DSH contract
        run: npx --yes @deepseek-ai/dsh@0.1.0-rc.6 --version
        env:
          DSH_HOME: ${{ runner.temp }}/dshpack-contract-version-home

      - name: Run isolated real-DSH smoke test
        run: pnpm exec node scripts/smoke-real-dsh.mjs
        env:
          DSH_HOME: ${{ runner.temp }}/dshpack-contract-version-home
